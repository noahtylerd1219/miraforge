name: Build MiraForge VST3 (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout MiraForge
        uses: actions/checkout@v4

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Get JUCE
        shell: pwsh
        run: |
          git clone --depth 1 --branch 8.0.12 https://github.com/juce-framework/JUCE.git third_party/JUCE

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -DJUCE_DIR="${{ github.workspace }}\third_party\JUCE" -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        shell: pwsh
        run: |
          cmake --build build --config Release --target MiraForge_VST3

      - name: Collect plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $plugin = Get-ChildItem -Path build -Filter "MiraForge.vst3" -Directory -Recurse | Select-Object -First 1
          if (-not $plugin) { throw "MiraForge.vst3 was not found after the build." }
          Copy-Item -Path $plugin.FullName -Destination dist/MiraForge.vst3 -Recurse
          Compress-Archive -Path dist/MiraForge.vst3 -DestinationPath MiraForge-Windows-VST3.zip -Force

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: MiraForge-Windows-VST3
          path: MiraForge-Windows-VST3.zip
          if-no-files-found: error
